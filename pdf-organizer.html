<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Klyro — PDF Organizer</title>
<meta name="description" content="Free PDF organizer — reorder, rotate, delete, duplicate, extract, merge pages. All processing runs in your browser." />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%233b82f6'/%3E%3Cstop offset='1' stop-color='%23a855f7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='24' fill='%23060814'/%3E%3Ctext x='50' y='68' font-size='54' font-family='sans-serif' font-weight='700' fill='url(%23g)' text-anchor='middle'%3EK%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="pdf-organizer.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>

<!-- ============ HEADER ============ -->
<header class="app-header">
  <div class="header-left">
    <a href="/" class="back-link" aria-label="Back to Klyro">
      <svg viewBox="0 0 24 24" fill="none" width="20" height="20"><path d="M19 12H5M12 19l-7-7 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Klyro</span>
    </a>
    <div class="header-divider"></div>
    <h1 class="header-title">PDF Organizer</h1>
  </div>
  <div class="header-right">
    <div class="header-group" id="historyBtns" style="display:none;">
      <button class="hdr-btn" id="undoBtn" title="Undo (Ctrl+Z)" disabled>
        <svg viewBox="0 0 24 24" fill="none" width="18" height="18"><path d="M3 10h10a5 5 0 015 5v2M3 10l5-5M3 10l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="hdr-btn" id="redoBtn" title="Redo (Ctrl+Shift+Z)" disabled>
        <svg viewBox="0 0 24 24" fill="none" width="18" height="18"><path d="M21 10H11a5 5 0 00-5 5v2M21 10l-5-5M21 10l-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <button class="hdr-btn export-btn" id="exportBtn" disabled>
      <svg viewBox="0 0 24 24" fill="none" width="18" height="18"><path d="M12 3v12m0 0l-4-4m4 4l4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Download</span>
    </button>
  </div>
</header>

<!-- ============ MOBILE BOTTOM BAR ============ -->
<nav class="mobile-bar" id="mobileBar">
  <button class="mob-btn" data-action="selectAll"><svg viewBox="0 0 24 24" fill="none" width="20" height="20"><path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="3" y="3" width="18" height="18" rx="3" stroke="currentColor" stroke-width="1.7"/></svg><span>Select</span></button>
  <button class="mob-btn" data-action="rotateRight"><svg viewBox="0 0 24 24" fill="none" width="20" height="20"><path d="M1 4v6h6M23 20v-6h-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.49 9A9 9 0 005.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 013.51 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Rotate</span></button>
  <button class="mob-btn" data-action="duplicateSelected"><svg viewBox="0 0 24 24" fill="none" width="20" height="20"><rect x="8" y="8" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.7"/><path d="M16 8V6a2 2 0 00-2-2H6a2 2 0 00-2 2v8a2 2 0 002 2h2" stroke="currentColor" stroke-width="1.7"/></svg><span>Dup</span></button>
  <button class="mob-btn" data-action="extractSelected"><svg viewBox="0 0 24 24" fill="none" width="20" height="20"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8l-6-6z" stroke="currentColor" stroke-width="1.7"/><path d="M14 2v6h6" stroke="currentColor" stroke-width="1.7"/></svg><span>Extract</span></button>
  <button class="mob-btn danger" data-action="deleteSelected"><svg viewBox="0 0 24 24" fill="none" width="20" height="20"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Delete</span></button>
</nav>

<!-- ============ LAYOUT ============ -->
<div class="app-layout">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-inner">
      <div class="sidebar-section">
        <h3 class="sidebar-heading">Quick Actions</h3>
        <button class="side-btn" data-action="selectAll"><svg viewBox="0 0 24 24" fill="none" width="16" height="16"><path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="3" y="3" width="18" height="18" rx="3" stroke="currentColor" stroke-width="1.7"/></svg>Select all</button>
        <button class="side-btn" data-action="deselectAll"><svg viewBox="0 0 24 24" fill="none" width="16" height="16"><rect x="3" y="3" width="18" height="18" rx="3" stroke="currentColor" stroke-width="1.7"/></svg>Deselect all</button>
        <button class="side-btn" data-action="rotateRight"><svg viewBox="0 0 24 24" fill="none" width="16" height="16"><path d="M1 4v6h6M23 20v-6h-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.49 9A9 9 0 005.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 013.51 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Rotate right</button>
        <button class="side-btn" data-action="rotateLeft"><svg viewBox="0 0 24 24" fill="none" width="16" height="16"><path d="M23 4v6h-6M1 20v-6h6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Rotate left</button>
        <button class="side-btn" data-action="rotate180"><svg viewBox="0 0 24 24" fill="none" width="16" height="16"><path d="M17 1l4 4-4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 11V9a4 4 0 014-4h14M7 23l-4-4 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 13v2a4 4 0 01-4 4H3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Rotate 180°</button>
        <div class="side-divider"></div>
        <button class="side-btn" data-action="duplicateSelected"><svg viewBox="0 0 24 24" fill="none" width="16" height="16"><rect x="8" y="8" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.7"/><path d="M16 8V6a2 2 0 00-2-2H6a2 2 0 00-2 2v8a2 2 0 002 2h2" stroke="currentColor" stroke-width="1.7"/></svg>Duplicate</button>
        <button class="side-btn" data-action="extractSelected"><svg viewBox="0 0 24 24" fill="none" width="16" height="16"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8l-6-6z" stroke="currentColor" stroke-width="1.7"/><path d="M14 2v6h6" stroke="currentColor" stroke-width="1.7"/></svg>Extract selected</button>
        <button class="side-btn" data-action="addBlank"><svg viewBox="0 0 24 24" fill="none" width="16" height="16"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Add blank page</button>
        <button class="side-btn" data-action="reverseAll"><svg viewBox="0 0 24 24" fill="none" width="16" height="16"><path d="M7 16V4m0 12l-3-3m3 3l3-3M17 8v12m0-12l3 3m-3-3l-3 3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>Reverse order</button>
        <button class="side-btn danger" data-action="deleteSelected"><svg viewBox="0 0 24 24" fill="none" width="16" height="16"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>Delete selected</button>
      </div>

      <div class="sidebar-section">
        <h3 class="sidebar-heading">Advanced</h3>
        <button class="side-btn" data-action="merge"><svg viewBox="0 0 24 24" fill="none" width="16" height="16"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Merge PDFs</button>
        <button class="side-btn" data-action="split"><svg viewBox="0 0 24 24" fill="none" width="16" height="16"><path d="M4 4v16M20 4v16M4 12h16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>Split PDF</button>
        <button class="side-btn" data-action="numberPages"><svg viewBox="0 0 24 24" fill="none" width="16" height="16"><path d="M4 6h16M4 12h10M4 18h14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>Page numbers</button>
        <button class="side-btn" data-action="watermark"><svg viewBox="0 0 24 24" fill="none" width="16" height="16"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" stroke="currentColor" stroke-width="1.7"/></svg>Watermark</button>
        <button class="side-btn" data-action="metadata"><svg viewBox="0 0 24 24" fill="none" width="16" height="16"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.7"/><path d="M12 16v-4M12 8h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Metadata</button>
      </div>

      <div class="sidebar-footer">
        <div class="privacy-badge">
          <svg viewBox="0 0 24 24" fill="none" width="14" height="14"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" stroke="currentColor" stroke-width="1.7"/></svg>
          <span>100% private — files never leave your device</span>
        </div>
      </div>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main-content" id="mainContent">

    <!-- UPLOAD STATE -->
    <div class="upload-state" id="uploadState">
      <div class="upload-zone" id="uploadZone" tabindex="0" role="button" aria-label="Upload PDF">
        <div class="upload-icon">
          <svg viewBox="0 0 24 24" fill="none" width="48" height="48"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8l-6-6z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M14 2v6h6" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M12 18v-6M9 15l3-3 3 3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <h2 class="upload-title">Drop a PDF here</h2>
        <p class="upload-sub">or click to browse</p>
        <p class="upload-hint">Organize pages, merge documents, split, rotate &amp; more</p>
        <input type="file" id="fileInput" accept="application/pdf" multiple aria-hidden="true" />
      </div>
    </div>

    <!-- EDITOR STATE -->
    <div class="editor-state" id="editorState" style="display:none;">

      <!-- TOOLBAR -->
      <div class="toolbar" id="toolbar">
        <div class="toolbar-left">
          <span class="page-count" id="pageCount">0 pages</span>
          <span class="selection-count" id="selCount"></span>
        </div>
        <div class="toolbar-center">
          <button class="tb-btn" data-action="selectAll" title="Select all">
            <svg viewBox="0 0 24 24" fill="none" width="16" height="16"><path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="3" y="3" width="18" height="18" rx="3" stroke="currentColor" stroke-width="1.7"/></svg>
          </button>
          <button class="tb-btn" data-action="rotateLeft" title="Rotate left">
            <svg viewBox="0 0 24 24" fill="none" width="16" height="16"><path d="M23 4v6h-6M1 20v-6h6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="tb-btn" data-action="rotateRight" title="Rotate right">
            <svg viewBox="0 0 24 24" fill="none" width="16" height="16"><path d="M1 4v6h6M23 20v-6h-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.49 9A9 9 0 005.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 013.51 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="tb-divider"></div>
          <button class="tb-btn" data-action="duplicateSelected" title="Duplicate">
            <svg viewBox="0 0 24 24" fill="none" width="16" height="16"><rect x="8" y="8" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.7"/><path d="M16 8V6a2 2 0 00-2-2H6a2 2 0 00-2 2v8a2 2 0 002 2h2" stroke="currentColor" stroke-width="1.7"/></svg>
          </button>
          <button class="tb-btn" data-action="extractSelected" title="Extract selected">
            <svg viewBox="0 0 24 24" fill="none" width="16" height="16"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8l-6-6z" stroke="currentColor" stroke-width="1.7"/><path d="M14 2v6h6" stroke="currentColor" stroke-width="1.7"/></svg>
          </button>
          <div class="tb-divider"></div>
          <button class="tb-btn danger" data-action="deleteSelected" title="Delete selected">
            <svg viewBox="0 0 24 24" fill="none" width="16" height="16"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <div class="toolbar-right">
          <button class="tb-btn" data-action="addBlank" title="Add blank page">
            <svg viewBox="0 0 24 24" fill="none" width="16" height="16"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
          <button class="tb-btn add-more" id="addMoreBtn" title="Add more PDFs">
            <svg viewBox="0 0 24 24" fill="none" width="16" height="16"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <span class="tb-label">Add PDF</span>
          </button>
        </div>
      </div>

      <!-- PAGE GRID -->
      <div class="page-grid" id="pageGrid" role="list" aria-label="PDF pages"></div>

    </div>
  </main>
</div>

<!-- ============ TOAST ============ -->
<div class="toast" id="toast" aria-live="polite"></div>

<!-- ============ CONFIRM DIALOG ============ -->
<div class="dialog-overlay" id="dialogOverlay">
  <div class="dialog" role="alertdialog" aria-modal="true">
    <h3 class="dialog-title" id="dialogTitle"></h3>
    <p class="dialog-msg" id="dialogMsg"></p>
    <div class="dialog-actions">
      <button class="dialog-btn" id="dialogCancel">Cancel</button>
      <button class="dialog-btn dialog-btn-danger" id="dialogConfirm">Confirm</button>
    </div>
  </div>
</div>

<!-- ============ ADVANCED PANEL (slide-in) ============ -->
<div class="panel-overlay" id="panelOverlay">
  <div class="panel" id="advPanel" role="dialog" aria-modal="true" aria-labelledby="panelTitle">
    <div class="panel-head">
      <h3 id="panelTitle">Advanced</h3>
      <button class="panel-close" id="panelClose" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" width="20" height="20"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="panel-body" id="panelBody"></div>
  </div>
</div>

<!-- ============ EXPORT PANEL ============ -->
<div class="panel-overlay" id="exportOverlay">
  <div class="panel export-panel" role="dialog" aria-modal="true">
    <div class="panel-head">
      <h3>Export PDF</h3>
      <button class="panel-close" id="exportClose" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" width="20" height="20"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="panel-body">
      <div class="export-stats">
        <div class="stat-box"><div class="num" id="expPages">0</div><div class="lab">pages</div></div>
        <div class="stat-box"><div class="num" id="expSize">–</div><div class="lab">est. size</div></div>
      </div>
      <div class="export-field">
        <label class="field-label">File name</label>
        <input type="text" id="expFilename" value="organized" />
      </div>
      <div class="export-field">
        <label class="field-label">Page range</label>
        <input type="text" id="expRange" placeholder="All pages" />
        <span class="field-hint">e.g. 1-5, 8, 11-13</span>
      </div>
      <button class="btn btn-block" id="exportDownload">
        <svg viewBox="0 0 24 24" fill="none" width="18" height="18"><path d="M12 3v12m0 0l-4-4m4 4l4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Download PDF
      </button>
    </div>
  </div>
</div>

<!-- Hidden file input for adding more PDFs -->
<input type="file" id="addMoreInput" accept="application/pdf" multiple style="display:none;" />

<script src="pdf-organizer.js"></script>
</body>
</html>
